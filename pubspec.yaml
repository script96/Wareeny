name: warene
description: "AI assistive app for visually impaired users in Egypt."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  flutter_vision: ^2.0.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/yolov8n.tflite
    - assets/models/labels.txt