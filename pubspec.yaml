name: warene
description: "AI assistive app for visually impaired users in Egypt."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  flutter_vision: ^2.0.0
  http: ^1.2.2
  flutter_dotenv: ^6.0.0
  google_mlkit_text_recognition: ^0.13.1
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/yolov8n.tflite
    - assets/models/labels.txt
    - assets/models/currency_yolov8m.tflite
    - assets/models/currency_labels.txt